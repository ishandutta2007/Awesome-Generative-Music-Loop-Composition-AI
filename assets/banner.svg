<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Waveform Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.85" />
    </linearGradient>

    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Keyframe Styles for Animation -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.03); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.15); }
      }
      @keyframes loopRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes soundBar {
        0%, 100% { height: 16px; transform: translateY(0); }
        50% { height: 64px; transform: translateY(-24px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -120; }
      }

      .floating-orb1 {
        animation: pulseOrb 8s ease-in-out infinite alternate;
        transform-origin: 250px 180px;
      }
      .floating-orb2 {
        animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
        transform-origin: 950px 220px;
      }
      .waveform-line {
        stroke-dasharray: 8 6;
        animation: dashMove 6s linear infinite;
      }
      .loop-icon-spin {
        animation: loopRotate 20s linear infinite;
        transform-origin: 960px 140px;
      }
      .bar-anim-1 { animation: soundBar 1.4s ease-in-out infinite 0.1s; }
      .bar-anim-2 { animation: soundBar 1.2s ease-in-out infinite 0.3s; }
      .bar-anim-3 { animation: soundBar 1.6s ease-in-out infinite 0.5s; }
      .bar-anim-4 { animation: soundBar 1.1s ease-in-out infinite 0.2s; }
      .bar-anim-5 { animation: soundBar 1.5s ease-in-out infinite 0.4s; }
      .bar-anim-6 { animation: soundBar 1.3s ease-in-out infinite 0.6s; }
      .bar-anim-7 { animation: soundBar 1.7s ease-in-out infinite 0.25s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="floating-orb1" cx="250" cy="160" r="180" fill="url(#glowGrad1)" filter="url(#blurGlow)" />
  <circle class="floating-orb2" cx="950" cy="220" r="220" fill="url(#glowGrad2)" filter="url(#blurGlow)" />

  <!-- Subtle Studio Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="70" x2="1200" y2="70" stroke-dasharray="4 8" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke-dasharray="4 8" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke-dasharray="4 8" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4 8" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke-dasharray="4 8" />
    <line x1="150" y1="0" x2="150" y2="420" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="420" stroke-dasharray="4 8" />
    <line x1="450" y1="0" x2="450" y2="420" stroke-dasharray="4 8" />
    <line x1="600" y1="0" x2="600" y2="420" stroke-dasharray="4 8" />
    <line x1="750" y1="0" x2="750" y2="420" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="420" stroke-dasharray="4 8" />
    <line x1="1050" y1="0" x2="1050" y2="420" stroke-dasharray="4 8" />
  </g>

  <!-- Background Dynamic Waveform Curves -->
  <g opacity="0.35">
    <path class="waveform-line" d="M 0,330 C 150,300 250,360 400,320 C 550,280 650,340 800,310 C 950,280 1050,350 1200,315" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
    <path class="waveform-line" d="M 0,345 C 180,370 280,310 440,340 C 600,370 700,290 860,335 C 1020,380 1100,320 1200,340" fill="none" stroke="#06b6d4" stroke-width="1.8" />
  </g>

  <!-- Right Side Visual: Generative Audio Equalizer Visualizer & Seamless Loop Ring -->
  <g transform="translate(960, 140)">
    <!-- Rotating Loop Ring Indicator -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6" />
    <g class="loop-icon-spin">
      <circle cx="0" cy="0" r="64" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="140 60" />
      <polygon points="46,-10 64,0 46,10" fill="#ec4899" />
    </g>
    <!-- Center Music Symbol -->
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" text-anchor="middle" fill="#f3f4f6" opacity="0.9">🔁</text>
  </g>

  <!-- Dynamic Rhythm Visualizer Bars (Bottom Right) -->
  <g transform="translate(860, 275)" opacity="0.75">
    <rect class="bar-anim-1" x="0" y="0" width="8" rx="4" fill="#8b5cf6" />
    <rect class="bar-anim-2" x="16" y="0" width="8" rx="4" fill="#a855f7" />
    <rect class="bar-anim-3" x="32" y="0" width="8" rx="4" fill="#ec4899" />
    <rect class="bar-anim-4" x="48" y="0" width="8" rx="4" fill="#f43f5e" />
    <rect class="bar-anim-5" x="64" y="0" width="8" rx="4" fill="#06b6d4" />
    <rect class="bar-anim-6" x="80" y="0" width="8" rx="4" fill="#3b82f6" />
    <rect class="bar-anim-7" x="96" y="0" width="8" rx="4" fill="#10b981" />
    <rect class="bar-anim-2" x="112" y="0" width="8" rx="4" fill="#8b5cf6" />
    <rect class="bar-anim-4" x="128" y="0" width="8" rx="4" fill="#ec4899" />
    <rect class="bar-anim-1" x="144" y="0" width="8" rx="4" fill="#06b6d4" />
    <rect class="bar-anim-3" x="160" y="0" width="8" rx="4" fill="#10b981" />
  </g>

  <!-- Foreground Content Block (Clean, Clear, Crisp Contrast) -->
  <g transform="translate(70, 75)">
    <!-- Category Badge -->
    <g filter="url(#pillShadow)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <circle cx="15" cy="15" r="5" fill="#10b981" />
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#9ca3af" letter-spacing="1.5">AWESOME CURATED LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Generative Music &amp; Loop Composition AI
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="url(#accentGrad)">
      Seamless Loop Synthesis • AI Beatmaking • Symbolic MIDI • Live Sequencers
    </text>

    <!-- Secondary Description -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af">
      Top commercial SaaS platforms &amp; open-source repositories ranked with pricing &amp; GitHub stars
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: AudioCraft & MusicGen -->
      <g filter="url(#pillShadow)">
        <rect x="0" y="0" width="168" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">Meta AudioCraft</text>
      </g>

      <!-- Pill 2: Tencent LoopForge -->
      <g transform="translate(180, 0)" filter="url(#pillShadow)">
        <rect x="0" y="0" width="162" height="34" rx="8" fill="#311042" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f3e8ff">LoopForge AI</text>
      </g>

      <!-- Pill 3: Suno & Udio -->
      <g transform="translate(354, 0)" filter="url(#pillShadow)">
        <rect x="0" y="0" width="144" height="34" rx="8" fill="#371b28" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fce7f3">Suno &amp; Udio</text>
      </g>

      <!-- Pill 4: Strudel & Sonic Pi -->
      <g transform="translate(510, 0)" filter="url(#pillShadow)">
        <rect x="0" y="0" width="182" height="34" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">Live-Coding Audio</text>
      </g>

      <!-- Pill 5: Magenta & MIDI -->
      <g transform="translate(704, 0)" filter="url(#pillShadow)">
        <rect x="0" y="0" width="156" height="34" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1fae5">Symbolic MIDI</text>
      </g>
    </g>
  </g>
</svg>
